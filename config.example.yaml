# Automation Tools
tools:
  shell:
    enabled: true
  filesystem:
    enabled: true
  browser:
    enabled: true
  http-client:
    enabled: true
  scheduler:
    enabled: true
  webhook:
    enabled: true
    port: 9876
  database:
    enabled: true
    path: "./data/tools.db"
  code-runner:
    enabled: true
  scraper:
    enabled: true
  git:
    enabled: true
  docker:
    enabled: true
  image-gen:
    enabled: true
    apiKey: "${OPENAI_API_KEY}"

# Memory system
memory:
  enabled: true
  embeddingProvider: "openrouter"  # or "openai", "local"
  embeddingModel: "text-embedding-3-small"
  chunkSize: 512
  chunkOverlap: 64
  maxMemories: 10000
  autoMemorize: true  # Auto-extract facts from conversations

# Skills - extensible skill modules
skills:
  enabled: true
  directory: "./skills"
  # autoload: true

# Extensions
extensions:
  enabled: true
  directory: "./extensions"

# Routing - message routing rules
routing:
  defaultHandler: "agent"
  commandPrefix: "/"
