# Hooks - lifecycle event hooks
hooks:
  enabled: true
  # rateLimit:
  #   maxPerMinute: 30
  # contentFilter:
  #   patterns: ["badword1", "badword2"]

# Cron - scheduled tasks
cron:
  enabled: false
  # jobs:
  #   - name: "daily-summary"
  #     schedule: "0 9 * * *"
  #     action: "summarize-yesterday"

# TTS/STT - Voice
voice:
  tts:
    enabled: false
    provider: "openai"  # or "edge"
    voice: "alloy"
  stt:
    enabled: false
    provider: "openai"

# Daemon settings
daemon:
  pidFile: "~/.hydraclaw/daemon.pid"
  logFile: "~/.hydraclaw/daemon.log"
  autoRestart: true
  healthCheckInterval: 30000  # 30 seconds

# Storage
store:
  path: "./data/hydraclaw.db"
  vectorStore: true

