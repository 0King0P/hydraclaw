# Automation Tools - all enabled by default, no restrictions
tools:
  shell:
    enabled: true
  filesystem:
    enabled: true
  browser:
    enabled: true
  http-client:
    enabled: true
  scheduler:
    enabled: true
  webhook:
    enabled: true
    port: 9876
  database:
    enabled: true
    path: "./data/tools.db"
  code-runner:
    enabled: true
  scraper:
    enabled: true
  git:
    enabled: true
  docker:
    enabled: true
  image-gen:
    enabled: true
    apiKey: "${OPENAI_API_KEY}"

# Storage
store:
  path: "./data/hydraclaw.db"
  vectorStore: false
