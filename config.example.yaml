# HydraClaw Configuration
# Copy this file to config.yaml and fill in your credentials
# Or run: hydraclaw onboard

# Gateway server settings
gateway:
  host: "0.0.0.0"
  port: 3000
  wsPort: 3001
  webhookPort: 9876
  auth:
    enabled: false
    # tokens:
    #   - "your-secret-token"
  rateLimit:
    enabled: true
    maxRequests: 60
    windowMs: 60000
  discovery:
    enabled: false
    # nodeId: "hydraclaw-main"

# Agent settings
agent:
  defaultProvider: "openrouter"
  defaultModel: "anthropic/claude-sonnet-4-5-20250929"
  systemPrompt: "You are HydraClaw, a powerful multi-headed AI assistant. You can execute shell commands, browse the web, manage files, run code, and interact across multiple messaging platforms. Help the user with anything they need."
  maxTokens: 8192
  temperature: 0.7
  maxHistory: 100
  failoverProviders:
    - "anthropic"
    - "openai"
    - "google"
    - "groq"

# AI Providers - configure the ones you want to use
# OpenRouter is recommended as it provides access to 200+ models from all providers
providers:
  # OpenRouter - recommended, access 200+ models through a single API key
  openrouter:
    apiKey: "${OPENROUTER_API_KEY}"
    # Route preferences: price, speed, latency
    routePreference: "price"
    # Custom headers
    httpReferer: "https://hydraclaw.dev"
    xTitle: "HydraClaw"
    # Enable dynamic model fetching from OpenRouter API
    dynamicModels: true
    # Model fallback chain
    fallbackModels:
      - "anthropic/claude-sonnet-4-5-20250929"
      - "openai/gpt-4o"
      - "google/gemini-2.0-flash"
      - "meta-llama/llama-3.3-70b-instruct"

  anthropic:
    apiKey: "${ANTHROPIC_API_KEY}"

  openai:
    apiKey: "${OPENAI_API_KEY}"

  google:
    apiKey: "${GOOGLE_API_KEY}"

  # mistral:
  #   apiKey: "${MISTRAL_API_KEY}"

  # groq:
  #   apiKey: "${GROQ_API_KEY}"

