services:
  hydraclaw:
    build: .
    container_name: hydraclaw
    restart: unless-stopped
    ports:
      - "3000:3000"   # HTTP API
      - "3001:3001"   # WebSocket
      - "9876:9876"   # Webhooks
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    # Allow container to reach Ollama running on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: Run Ollama alongside HydraClaw
  # Uncomment to use a containerized Ollama instance
