services:
  hydraclaw:
    build: .
    container_name: hydraclaw
    restart: unless-stopped
    ports:
      - "3000:3000"   # HTTP API + OpenAI-compatible endpoint
      - "3001:3001"   # WebSocket
      - "9876:9876"   # Webhooks
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./skills:/app/skills:ro
      - ./extensions:/app/extensions:ro
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
