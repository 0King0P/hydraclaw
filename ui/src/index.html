<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydraClaw Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a2e;
      --border: #2a2a3e;
      --text: #e0e0e8;
      --text-dim: #8888a0;
      --accent: #6c5ce7;
      --accent-glow: rgba(108, 92, 231, 0.3);
      --user-bg: #1e1e3a;
      --assistant-bg: #16162a;
      --success: #00e676;
      --error: #ff5252;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #6c5ce7, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .status.connected { color: var(--success); border-color: var(--success); }
    .status.disconnected { color: var(--error); border-color: var(--error); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--accent);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      color: var(--text-dim);
      font-size: 12px;
      font-style: italic;
    }

    .message .meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .typing {
      align-self: flex-start;
      color: var(--text-dim);
      font-size: 13px;
      padding: 8px 16px;
    }

    .typing span {
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      gap: 12px;
    }

    #input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 200px;
    }

    #input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #send-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #send-btn:active { transform: translateY(0); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>HydraClaw</h1>
    <div id="status" class="status disconnected">Disconnected</div>
  </header>

  <div id="chat"></div>

  <div id="input-area">
    <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    const WS_URL = `ws://${location.hostname}:3001`;
    let ws = null;
    let currentAssistantMsg = null;
    const senderId = 'webchat-' + Math.random().toString(36).slice(2, 10);

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'status connected';
        addSystemMessage('Connected to HydraClaw');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'stream') {
          if (!currentAssistantMsg) {
            currentAssistantMsg = addMessage('', 'assistant');
          }
          if (data.chunk?.type === 'text' && data.chunk.content) {
            currentAssistantMsg.textContent += data.chunk.content;
            scrollToBottom();
          }
        } else if (data.type === 'complete') {
          if (!currentAssistantMsg && data.result?.content) {
            addMessage(data.result.content, 'assistant');
          }
          currentAssistantMsg = null;
          sendBtn.disabled = false;
        } else if (data.type === 'error') {
          addMessage('Error: ' + (data.error || 'Unknown error'), 'system');
          currentAssistantMsg = null;
          sendBtn.disabled = false;
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status disconnected';
        addSystemMessage('Disconnected. Reconnecting...');
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        statusEl.textContent = 'Error';
        statusEl.className = 'status disconnected';
      };
    }

    function addMessage(text, role) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = text;
      chat.appendChild(el);
      scrollToBottom();
      return el;
    }

    function addSystemMessage(text) {
      addMessage(text, 'system');
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

      addMessage(text, 'user');
      ws.send(JSON.stringify({
        type: 'chat',
        content: text,
        channelId: 'webchat',
        senderId: senderId,
      }));

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      currentAssistantMsg = null;
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    });

    connect();
  </script>
</body>
</html>
